# Load balancer configuration for Photon Proxy
# Copy to: /etc/nginx/sites-available/photon-proxy
# Enable with: sudo ln -s /etc/nginx/sites-available/photon-proxy /etc/nginx/sites-enabled/

upstream photon_backend {
    # Least connections load balancing (best for variable request times)
    least_conn;

    # Multiple proxy instances
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;

    # Optional: Add more instances as needed
    # server 127.0.0.1:8083 max_fails=3 fail_timeout=30s;
    # server 127.0.0.1:8084 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Optional: Add your domain
    # server_name proxy.yourdomain.com;

    # Access logging
    access_log /var/log/nginx/photon-proxy-access.log;
    error_log /var/log/nginx/photon-proxy-error.log;

    # Client limits
    client_max_body_size 10M;
    client_body_timeout 30s;

    location / {
        proxy_pass http://photon_backend;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Keep alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check endpoint (optional - for monitoring)
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
